name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL C and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # Read workflow metadata for analysis in private repositories.
      security-events: write # Upload CodeQL results without repository-content write access.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Install build dependencies
        run: |
          sudo -n apt-get update
          sudo -n apt-get install -y ninja-build libssl-dev
      - name: Build for analysis
        run: |
          cmake -S . -B build-codeql -GNinja \
            -DBMC_COMPOSITE_EAT_BUILD_TESTS=ON \
            -DBMC_COMPOSITE_EAT_BUILD_EXAMPLES=ON
          cmake --build build-codeql
      - name: Analyze C and C++
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d
        with:
          category: /language:c-cpp

  dependency-review:
    name: Dependency review
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      github.event.before != '0000000000000000000000000000000000000000')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          base-ref: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
          fail-on-severity: high
          comment-summary-in-pr: never
